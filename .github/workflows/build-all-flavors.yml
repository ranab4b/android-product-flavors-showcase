name: Build All Flavors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [Brewline, Cafenova, Roasthouse]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }} debug APK
        run: ./gradlew assemble${{ matrix.flavor }}Debug --stacktrace

      - name: Lowercase flavor name
        id: vars
        run: echo "lower=$(echo '${{ matrix.flavor }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.lower }}-debug-apk
          path: app/build/outputs/apk/${{ steps.vars.outputs.lower }}/debug/*.apk
